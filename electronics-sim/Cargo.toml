[package]
name = "electronics-sim"
version = "0.1.0"
edition = "2024"
publish = ["gitea"]

[features]
# Print tabular per-cycle data to stdout instead of launching rerun.
# Run with: cargo run --bin buck-boost-test --features text-log
default = ["rerun"]
text-log = []
rerun = ["dep:rerun"]

[dependencies]
full-control = { path = "../full-control", default-features = false }
pid = "4.0.0"
rerun = { version = "0.24.0", optional = true}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdn-schema = { path = "../../kicad_field_solver/pdn_schema" }

[[bin]]
name = "scope-capture"
path = "src/bin/scope_capture.rs"
