[package]
name = "peri-planner"
version = "0.1.0"
edition = "2024"
# The app is the default `cargo run` target (the other bins are offline
# generators behind their own features).
default-run = "peri-planner"

# cdylib is needed so trunk can build a .wasm file; rlib allows the bin to use the lib.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "peri-planner"
path = "src/main.rs"

# One-shot extractor: pulls peripheral / pin-AF tables from `stm32-metapac`
# and writes a `src/mcu_data/<chip>.rs` file. Run per-chip; commit output.
# Not part of the regular build — only built when an `extract-*` feature
# is enabled, which activates the optional metapac dep.
[[bin]]
name = "extract"
path = "tools/extract.rs"
required-features = ["extract"]

# Whole-lineup catalog generator: distills stm32-data's per-chip JSON into the
# embedded `assets/catalog.json` consumed by `src/catalog.rs`. Reads the
# generated JSON directly (no metapac build), so one run emits all ~1600 parts.
#   cargo run --bin gen_catalog --features gen-catalog -- <stm32-data>/build/data/chips
[[bin]]
name = "gen_catalog"
path = "tools/gen_catalog.rs"
required-features = ["gen-catalog"]

# Tier-3 fabric generator: recovers analog cross-peripheral routing (DAC->COMP,
# etc.) from stm32-data-sources CubeMX "modes" XML into `src/fabric_data.rs`.
#   cargo run --bin gen_fabric --features gen-fabric -- <cubedb>/mcu/IP/COMP-..._G4_..._Modes.xml
[[bin]]
name = "gen_fabric"
path = "tools/gen_fabric.rs"
required-features = ["gen-fabric"]

# Whole-lineup descriptor generator: per-package-letter pin/AF + DMA from
# stm32-data chip JSON into `assets/descriptors.json`, parsed at runtime so the
# selector can verify (Tier-2) the whole lineup without compiling ~870 statics.
#   cargo run --bin gen_descriptors --features gen-descriptors -- <stm32-data>/build/data/chips
[[bin]]
name = "gen_descriptors"
path = "tools/gen_descriptors.rs"
required-features = ["gen-descriptors"]

# Whole-lineup PHYSICAL pinout generator: per-footprint `position -> signal(s)`
# (incl. power rails) from stm32-data chip JSON into `assets/pinouts.json.gz`,
# the data layer for the drop-in / pin-compatibility finder.
#   cargo run --bin gen_pinouts --features gen-pinouts -- <stm32-data>/build/data/chips
[[bin]]
name = "gen_pinouts"
path = "tools/gen_pinouts.rs"
required-features = ["gen-pinouts"]

[dependencies]
# egui + eframe + egui_plot must use the same major.minor version.
eframe    = { version = "0.33", features = ["glow", "persistence"] }
egui      = "0.33"
egui_plot = "0.34"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust (miniz_oxide) backend so it builds for wasm too. Used to inflate the
# embedded gzipped descriptor asset at runtime (and deflate it in the generator).
flate2     = { version = "1", default-features = false, features = ["rust_backend"] }

# Optional, only pulled in when an `extract-*` feature is enabled. The
# regular `cargo build` does not depend on this — it's used solely by the
# `extract` bin to dump chip metadata into `src/mcu_data/`.
# Pinned to a rev that includes the STM32C5 series (added upstream 2026). The
# old die-level chip features (stm32g474re, stm32h523ze, ...) still exist here.
stm32-metapac = { git = "https://github.com/embassy-rs/stm32-data-generated", rev = "2ab6df2582c6ef8b218272b26aa3db1b74998aa5", default-features = false, features = ["metadata"], optional = true }

[features]
extract       = ["dep:stm32-metapac"]
# Generator gates (no extra deps; keep the bins out of normal builds).
gen-catalog   = []
gen-fabric    = []
gen-descriptors = []
gen-pinouts   = []
# One feature per package letter. The flash-size suffix doesn't affect
# pinout — `<letter>e` (max flash) is what we extract. Letter mapping:
# G474: C=LQFP48, M=WLCSP81, P=TFBGA100, Q=UFBGA121, R=LQFP64, V=LQFP100
# H523: C=LQFP48, H=UFBGA100, R=LQFP64, V=LQFP100, Z=LQFP144
extract-g474c = ["extract", "stm32-metapac/stm32g474ce"]
extract-g474m = ["extract", "stm32-metapac/stm32g474me"]
extract-g474p = ["extract", "stm32-metapac/stm32g474pe"]
extract-g474q = ["extract", "stm32-metapac/stm32g474qe"]
extract-g474r = ["extract", "stm32-metapac/stm32g474re"]
extract-g474v = ["extract", "stm32-metapac/stm32g474ve"]
extract-h523c = ["extract", "stm32-metapac/stm32h523ce"]
extract-h523h = ["extract", "stm32-metapac/stm32h523he"]
extract-h523r = ["extract", "stm32-metapac/stm32h523re"]
extract-h523v = ["extract", "stm32-metapac/stm32h523ve"]
extract-h523z = ["extract", "stm32-metapac/stm32h523ze"]
# STM32C5 (Cortex-M33, no HRTIM but DAC/COMP/OPAMP + TIM1/TIM8). Ordering-code
# level feature names. C5A3Z = flagship line, LQFP144.
extract-c5a3z = ["extract", "stm32-metapac/stm32c5a3zgt6"]
# C531: the analog-rich C5 line (3 COMP + OPAMP + TIM1/TIM8). LQFP64 (R).
extract-c531r = ["extract", "stm32-metapac/stm32c531rct6"]

[dev-dependencies]
# Matches the version eframe's `persistence` backend already locks; used only to
# assert the persisted project blob round-trips (enum-keyed map included).
ron = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned to match trunk 0.21.x's supported wasm-bindgen runtime — newer
# versions (0.2.116+) emit a `clone_ref` intrinsic that older trunk doesn't
# know how to lower. Sibling crates buck-sim-ui and kwr103-ui use the same.
wasm-bindgen         = "=0.2.114"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Storage", "Window"] }
